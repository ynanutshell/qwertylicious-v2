{{- $url := .QueryParam "url" -}}
{{- $folderID := .QueryParam "folderId" -}}

<span script="install popUp(position:'center')" hx-target="this" hx-swap="outerHTML" hx-push-url="false">
	<button class="popUp-button"><i class="ti ti-more-horizontal"></i></button>
	<div class="popUp-content width-320" script="install Menu()">
		<div role="menu" class="menu">

			<div class="clickable flex-row" role="menuitem" hx-post="/@me/newsfeed/actor-button-follow?url={{$url}}&folderId={{$folderID}}">
				<div class="text-xl margin-none"><i class="ti ti-plus"></i></div>
				<div class="text-sm flex-grow-1 margin-left-xs">
					<div class="bold">Follow</div>
					<div class="text-light-gray">New Posts In Your Inbox</div>
				</div>
			</div>
			<div class="clickable flex-row" role="menuitem" hx-post="/@me/newsfeed/actor-button-mute?url={{$url}}&folderId={{$folderID}}">
				<div class="text-xl margin-none"><i class="ti ti-mute"></i></div>
				<div class="text-sm flex-grow-1 margin-left-xs">
					<div class="bold">Mute</div>
					<div class="text-light-gray">Silence This Sender</div>
				</div>
			</div>
			<div class="clickable flex-row" role="menuitem" hx-post="/@me/newsfeed/actor-button-block?url={{$url}}&folderId={{$folderID}}">
				<div class="text-xl margin-none"><i class="ti ti-block"></i></div>
				<div class="text-sm flex-grow-1 margin-left-xs">
					<div class="bold">Block</div>
					<div class="text-light-gray">Prevent All Contact</div>
				</div>
			</div>
		</div>
	</div>
</span>
