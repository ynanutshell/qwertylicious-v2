{{- $message := .Object -}}

{{- if eq "MUTED" $message.StateID -}}
	<button hx-post="/@me/newsfeed/message-unmute?messageId={{$message.ID}}" hx-target="this" hx-swap="outerHTML" hx-push-url="false" class="selected"><i class="ti ti-mute-fill"></i> Muted</button>
{{- else -}}
	<button hx-post="/@me/newsfeed/message-mute?messageId={{$message.ID}}" hx-target="this" hx-swap="outerHTML" hx-push-url="false"><i class="ti ti-mute"></i> Mute</button>
{{- end -}}
