{{- $isDesktop := .IsDesktop -}}

<div class="app padding" script="init send SelectNav(id:'settings')">
	<title>Security | Change Password</title>

	{{- if $isDesktop -}}
		<div id="app-sidebar" class="expanded">
			{{- template "menu" "security" -}}
		</div>
	{{- end -}}
	
	<div class="app-content transition-main-card">

		<div id="menu-bar">
			{{ if not $isDesktop }}
				<a class="button tertiary" href="/@me/settings/mobile" hx-boost="true"><i class="ti ti-back"></i> Back</a>
			{{ end }}

			<div class="{{ if not $isDesktop }}center{{else}}left{{end}} tabs">
				<a class="tab" href="/@me/settings/visibility" hx-boost="true">Visibility</a>
				<a class="tab selected" href="/@me/settings/password" hx-boost="true">Password</a>
				<a class="tab" href="/@me/settings/oauth" hx-boost="true">OAuth Clients</a>
				<a class="tab" href="/@me/settings/keyPackages" hx-boost="true">Encrypted Messages</a>
			</div>

			<div class="right">
				<a href="https://emissary.dev/user-profile" target="_blank" class="link">
					<i class="ti ti-help"></i>
					{{ if $isDesktop }} Help {{ end }}
				</a>
			</div>
		</div>
		
		<div class="card padding transition-main-card">

			<div
				hx-get="/@me/settings/password-form"
				hx-trigger="load"
				hx-target="this"
				hx-swap="innerHTML"
				hx-push-url="false">
			</div>
		</div>
	</div>
</div>
