{{- if ne "" .Name -}}

	<div class="text-lg bold margin-top-none margin-bottom-lg">
		<i class="ti ti-database-down"></i>
		<!--i class="bi bi-cloud-download"></i-->
		Importing From {{domainOnly .URL}}
	</div>
	{{- $iconURL := .Icon.Href -}}
	<div class="margin-bottom-lg flex-row">
		<div>
			{{- if ne "" $iconURL -}}
				<img src="{{$iconURL}}" alt="" class="width-64 circle">
			{{- else -}}
				<div class="width-64 circle flex-center"><i class="ti ti-person"></i></div>
			{{- end -}}
		</div>
		<div>
			<div class="bold">{{.Name}}</div>
			<div class="text-sm">
				<a href="{{.ID}}" class="text-nocolor text-gray" target="_blank">{{.UsernameOrID}} <i class="ti ti-link-outbound"></i></a>
			</div>
		</div>
	</div>

{{- end -}}
