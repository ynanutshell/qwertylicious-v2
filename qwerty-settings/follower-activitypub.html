{{- $url := .Actor.ProfileURL -}}
{{- $following := .AmFollowing $url -}}
{{- $actor := .ActivityStreamActor $url -}}

<div id="modal-header" class="flex-row">
	<div role="tablist" class="pills margin-bottom-none">
		<button role="tab" hx-get="/@me/newsfeed/browse-actor?url={{$actor.ID}}"><i class="ti ti-person"></i> Profile</button>
		<button role="tab" hx-get="/@me/newsfeed/notes?followingId={{$following.ID}}"><i class="ti ti-note"></i> Notes</button>

		{{ if $following.IsNew -}}
			<button role="tab" hx-get="/@me/settings/following-edit?url={{$actor.ID}}"><i class="ti ti-plus"></i> Follow</button>
		{{- else -}}
			<button role="tab" hx-get="/@me/settings/following-edit?url={{$actor.ID}}"><i class="ti ti-check"></i> Following</button>
		{{- end }}

		<button role="tab" aria-selected="true"><i class="ti ti-fediverse"></i> Follows You</button>
		<!--button script="on click trigger closeModal">Close</button-->
	</div>
</div>

<div id="modal-body" class="pos-relative">

	<div class="flex-row flex-align-center">
		{{- if $actor.HasIcon -}}
			<img src="{{$actor.Icon.Href}}" class="circle width-64">
		{{- else -}}
			<div class="circle width-64"></div>
		{{- end -}}

		<div class="flex-grow">
			<div class="text-lg bold margin-none">{{$actor.Name}}</div>
			<div class="text-light-gray">{{$actor.UsernameOrID}}</div>
		</div>

	</div>

	<div class="flex-row margin-bottom-lg">
		<div class="width-64"></div>
		<div class="text-green bold margin-top">
			<i class="ti ti-check-badge-fill"></i> Follows You via ActivityPub
		</div>
	</div>

    <div class="flex-row">
        <button script="on click trigger closeModal">Close Window</button>

		<div class="flex-grow-1 align-right">
			<button hx-get="/@me/settings/follower-delete?followerId={{.FollowerID.Hex}}" class="text-red">Remove Follower</button>
		</div>
	</div>
    
</div>
