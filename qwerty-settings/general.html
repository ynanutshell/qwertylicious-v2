{{- $isDesktop := .IsDesktop -}}

<div class="app padding" script="init send SelectNav(id:'settings')">
	<title>Profile | General</title>

	{{- if $isDesktop -}}
		<div id="app-sidebar" class="expanded">
			{{- template "menu" "general" -}}
		</div>
	{{- end -}}
	
	<div class="app-content">

		<div id="menu-bar">
			{{ if not $isDesktop }}
				<a href="/@me/settings/mobile" class="turboclick tab" hx-boost="true"><i class="ti ti-back"></i></a>
			{{ end }}
			<div class="{{ if not $isDesktop }}center{{else}}left{{end}} tabs">
				<a href="/@me/settings/general" class="turboclick tab selected" hx-boost="true">General</a>
				<a href="/@me/settings/images" class="turboclick tab" hx-boost="true">Images</a>
				<a href="/@me/settings/links" class="turboclick tab" hx-boost="true">Links</a>
				<a href="/@me/settings/import" class="turboclick tab" hx-boost="true">Import</a>
				<a href="/@me/settings/export" class="turboclick tab" hx-boost="true">Export</a>
			</div>
			<div class="right">
				<a href="https://emissary.dev/user-profile" target="_blank" class="button secondary">
					<i class="ti ti-help"></i>
					{{ if $isDesktop }} Help {{ end }}
				</a>
			</div>
		</div>

		<div class="card padding transition-main-card">
			<div
				hx-get="/@me/settings/general-form"
				hx-trigger="load"
				hx-target="this"
				hx-swap="outerHTML"
				hx-push-url="false">
			</div>
		</div>
	</div>
</div>
